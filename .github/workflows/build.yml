name: build-diyp-txt

on:
  schedule:
    # 源项目 sheriffcheng-gif/my-iptv 每天 UTC 00:00 / 12:00 更新，这里延后 5 分钟
    - cron: "5 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diyp-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 生成分类文件 + 同步台标
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build.py

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 山西联通DIYP.txt 山西联通DIYP.m3u icons/
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
            exit 0
          fi
          git commit -m "chore: rebuild DIYP txt/m3u"
          git pull --rebase origin main
          git push origin HEAD:main
