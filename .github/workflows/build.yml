name: build-diyp-txt

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 生成分类文件
        run: python build.py

      - name: 提交结果(API覆盖)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT=$(base64 -w 0 山西联通DIYP.txt)
          curl -f -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/Kimbe6688/shanxi-iptv-diyp/contents/%E5%B1%B1%E8%A5%BF%E8%81%94%E9%80%9ADIYP.txt" \
            -d "{\"message\":\"chore: rebuild DIYP txt\",\"content\":\"$CONTENT\"}"
