name: build-diyp-txt

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 生成分类文件
        run: python build.py

      - name: 提交结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c 'import os,base64,json,urllib.request;token=os.environ["GH_TOKEN"];repo="Kimbe6688/shanxi-iptv-diyp";fname="山西联通DIYP.txt";content=base64.b64encode(open(fname,"rb").read()).decode();url="https://api.github.com/repos/"+repo+"/contents/"+urllib.request.quote(fname);headers={"Authorization":"token "+token,"Accept":"application/vnd.github.v3+json"};sha=None;exec("try:\n req=urllib.request.Request(url,headers=headers)\n resp=urllib.request.urlopen(req)\n sha=json.loads(resp.read())[chr(115)+chr(104)+chr(97)]\nexcept:\n pass");body={"message":"chore: rebuild DIYP txt","content":content};exec("if sha: body[chr(115)+chr(104)+chr(97)]=sha");data=json.dumps(body).encode();req2=urllib.request.Request(url,data=data,headers={**headers,"Content-Type":"application/json"},method="PUT");resp2=urllib.request.urlopen(req2);print("OK:",resp2.status)'
